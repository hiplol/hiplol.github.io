<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hiplol // projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --text: #ffffff;
    --muted: #888888;
    --accent: #a3e635;
    --glass-bg: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; cursor: default; }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    z-index: -1;
    opacity: 0.4;
    animation: float 10s infinite ease-in-out alternate;
  }
  
  .blob-1 {
    width: 400px;
    height: 400px;
    background: var(--accent);
    top: -100px;
    left: -100px;
  }
  
  .blob-2 {
    width: 300px;
    height: 300px;
    background: #3b82f6;
    bottom: -50px;
    right: -50px;
    animation-delay: -5s;
  }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 50px) scale(1.1); }
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 24px;
  }
  header.container {
    padding-top: 20vh;
    padding-bottom: 60px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--accent);
    box-shadow: 0 0 20px rgba(163, 230, 53, 0.2);
    margin-bottom: 24px;
    transition: transform 0.3s ease;
  }

  .avatar:hover {
    transform: scale(1.05) rotate(5deg);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(163, 230, 53, 0.1);
    border: 1px solid rgba(163, 230, 53, 0.2);
    color: var(--accent);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 24px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 4rem;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
  }

  .gradient-text {
    background: linear-gradient(135deg, #ffffff 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    color: var(--muted);
    font-size: 1.1rem;
    max-width: 500px;
    margin-bottom: 0;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
  }

  .section-header h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .line {
    flex-grow: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--glass-border), transparent);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 24px;
    padding-bottom: 80px;
  }

  .card {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    opacity: 0;
    transform: translateY(20px);
  }

  .card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .card:hover {
    border-color: rgba(163, 230, 53, 0.4);
    box-shadow: 0 10px 40px -10px rgba(163, 230, 53, 0.15);
    transform: translateY(-5px);
  }

  .card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.3rem;
    margin-bottom: 12px;
  }

  .card p {
    color: var(--muted);
    font-size: 0.95rem;
    flex-grow: 1;
    margin-bottom: 24px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }

  .tag {
    background: rgba(255, 255, 255, 0.05);
    color: #d4d4d8;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .links {
    display: flex;
    gap: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 12px;
    transition: all 0.2s ease;
    cursor: pointer;
    flex: 1;
  }

  .btn svg {
    width: 16px;
    height: 16px;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
    border: 1px solid var(--accent);
  }

  .btn-primary:hover {
    background: #bcf05e;
    box-shadow: 0 0 15px rgba(163, 230, 53, 0.4);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--glass-border);
  }

  .btn-ghost:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    border: 1px dashed var(--glass-border);
    border-radius: 20px;
    font-size: 1.1rem;
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
  }

  footer {
    border-top: 1px solid var(--glass-border);
    padding: 32px 0;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }

  footer a { 
    color: var(--text); 
    text-decoration: none; 
    font-weight: 500;
    transition: color 0.2s;
  }

  footer a:hover { color: var(--accent); }

  @media (max-width: 600px) {
    h1 { font-size: 2.8rem; }
    header.container { padding-top: 12vh; padding-bottom: 40px; }
    .links { flex-direction: column; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <header class="container">
    <img src="https://ui-avatars.com/api/?name=H&background=050505&color=a3e635&size=128&font-size=0.4&bold=true" alt="Avatar" class="avatar">
    
    <div class="status-badge">
      <span class="status-dot"></span> <span id="status-text">Turning coffee into code</span>
    </div>
    
    <h1>Hi, I'm <span class="gradient-text">hiplol</span></h1>
    
    <p class="subtitle">I turn complex ideas into clean, functional code. Focused on building tools and interfaces that make life easier.</p>
  </header>

  <main class="container">
    <div class="section-header">
      <h2>Projects</h2>
      <div class="line"></div>
    </div>
    <div class="grid" id="projects"></div>
  </main>

  <footer>
    <div class="container">
      © <span id="year"></span> hiplol. All rights reserved.
    </div>
  </footer>

  <script>
    const statuses = [
      "Turning coffee into code",
      "Works on my machine",
      "Probably debugging...",
      "Ctrl+Z enthusiast",
      "Compiling ideas...",
      "Running on caffeine and curiosity"
    ];

    const projects = [
      {
        title: "Neon Runner",
        description: "Endless browser platformer. Jump, dodge, and collect coins. Features a shop and persistent upgrades.",
        tags: ["JavaScript", "Canvas", "Game"],
        demo: "https://hiplol.github.io/neon-runner/", 
        repo: "https://github.com/hiplol/neon-runner"
      },
      {
        title: "Ejudger",
        description: "A smart tool that analyzes source code to detect plagiarism and similarities between student submissions in Ejudge testing system.",
        tags: ["Python", "Algorithms", "Analysis"],
        demo: "https://silver-tables-hear.reverse.lol"
      },
      {
        title: "Fun Arcade",
        description: "A Duolingo-style educational game with math, mazes, and logic puzzles. Written in Python/Pygame and compiled for the web.",
        tags: ["Python", "Pygame", "WebAssembly", "Game"],
        demo: "https://hiplol.github.io/veselaya-igroteka/",
        repo: "https://github.com/hiplol/veselaya-igroteka"
      }, 
      {
        title: "English_professoriat",
        description: "Enuglish studying app to C1-C2 only by 2.5 years.",
        tags: ["HTML", "Study", "Analysis"],
        demo: "https://hiplol.github.io/english_practise/",
        repo: "https://github.com/hiplol/english_practise"
      },
      {
        "title": "Presentations",
        "description": "Static presentation gallery: AES-GCM encrypted PDFs, PBKDF2-unlocked viewer, per-user watermark (IP + fingerprint) and one-time voucher downloads for PPTX.",
        "tags": ["HTML", "Crypto", "Security"],
        "demo": "https://hiplol.github.io/presentations/",
        "repo": "https://github.com/hiplol/presentations"
      }
    ];

    const iconLink = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>`;
    const iconGithub = `<svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path></svg>`;

    const grid = document.getElementById("projects");

    if (projects.length === 0) {
      grid.innerHTML = `<div class="empty-state">No projects yet, but I'm already working on something new.</div>`;
    } else {
      grid.innerHTML = projects.map((p, index) => {
        const tags = (p.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
        
        const links = [
          p.demo ? `<a class="btn btn-primary" href="${p.demo}" target="_blank" rel="noopener">Live Demo ${iconLink}</a>` : "",
          p.repo ? `<a class="btn btn-ghost" href="${p.repo}" target="_blank" rel="noopener">Source Code ${iconGithub}</a>` : ""
        ].join("");

        return `
          <article class="card" style="transition-delay: ${index * 100}ms">
            <h3>${p.title}</h3>
            <p>${p.description}</p>
            <div class="tags">${tags}</div>
            <div class="links">${links}</div>
          </article>
        `;
      }).join("");
    }

    const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];
    document.getElementById("status-text").textContent = randomStatus;

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.card').forEach(card => observer.observe(card));

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
